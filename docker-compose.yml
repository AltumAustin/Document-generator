version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: docgen-postgres
    environment:
      POSTGRES_USER: docgen
      POSTGRES_PASSWORD: docgen_password
      POSTGRES_DB: docgen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docgen"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: docgen-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    container_name: docgen-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/docgen --ignore-existing;
      mc anonymous set download local/docgen/public;
      exit 0;
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docgen-app
    environment:
      DATABASE_URL: postgresql://docgen:docgen_password@postgres:5432/docgen
      NEXTAUTH_SECRET: docker-dev-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_BUCKET: docgen
      AWS_REGION: us-east-1
      AWS_S3_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

volumes:
  postgres_data:
  minio_data:
